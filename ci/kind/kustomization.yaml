# Single-node kind cluster used by CI (.github/workflows/full-stack.yml).
# Same manifests as production, scaled down to fit a 4-vCPU runner and
# pointed at images loaded with `kind load docker-image`.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../k8s
  - ../../k8s/istio

images:
  - name: distributed-engine-api
    newTag: ci
  - name: distributed-engine-worker
    newTag: ci
  - name: distributed-engine-web
    newTag: ci

patches:
  - target: { kind: Deployment, name: api }
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests
        value: { cpu: 100m, memory: 128Mi }
  - target: { kind: Deployment, name: worker }
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests
        value: { cpu: 100m, memory: 128Mi }
  - target: { kind: HorizontalPodAutoscaler, name: api-hpa }
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 1
      - op: replace
        path: /spec/maxReplicas
        value: 2
  - target: { kind: HorizontalPodAutoscaler, name: worker-hpa }
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 2
      - op: replace
        path: /spec/maxReplicas
        value: 3
  - target: { kind: PodDisruptionBudget, name: api-pdb }
    patch: |-
      - op: replace
        path: /spec/minAvailable
        value: 0
  - target: { kind: PodDisruptionBudget, name: worker-pdb }
    patch: |-
      - op: replace
        path: /spec/minAvailable
        value: 1
  - target: { kind: StatefulSet }
    patch: |-
      - op: replace
        path: /spec/volumeClaimTemplates/0/spec/resources/requests/storage
        value: 1Gi
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests
        value: { cpu: 100m, memory: 128Mi }
  # No cloud load balancer in kind: the API Service and the Gateway's
  # generated Service become ClusterIP, and CI reaches the Gateway through
  # `kubectl port-forward`.
  - target: { kind: Service, name: api }
    patch: |-
      - op: replace
        path: /spec/type
        value: ClusterIP
  - target: { kind: Gateway, name: engine-gateway }
    patch: |-
      - op: add
        path: /metadata/annotations
        value:
          networking.istio.io/service-type: ClusterIP
