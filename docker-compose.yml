services:
  postgres:
    image: postgres:16-alpine
    container_name: engine-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: distributed_engine
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: engine-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    command: redis-server --appendonly yes

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: engine-api
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      PORT: 3000
      REDIS_HOST: redis
      REDIS_PORT: 6379
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: distributed_engine
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      LOG_LEVEL: info
      # Traces: empty sends none. With the tracing profile, set it to
      # http://otel-collector:4318 (see docs/diagrams/05-tracing.md).
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      QUEUE_CONCURRENCY: 5
      # Required for /tasks, /schedules, /workers, /metrics. Set it in .env (see .env.example).
      OPERATOR_API_KEY: ${OPERATOR_API_KEY:?Set OPERATOR_API_KEY in .env - see .env.example}
      RECONCILER_INTERVAL_MS: ${RECONCILER_INTERVAL_MS:-30000}
      RECONCILER_QUEUED_GRACE_MS: ${RECONCILER_QUEUED_GRACE_MS:-60000}
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      # The image is node:22-alpine with no curl, so probe with Node itself.
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    # No container_name: workers must be scalable (docker compose up --scale worker=3).
    # SIGTERM gives running tasks a 20 s drain, then hands the rest back; the
    # process exits by 30 s. Compose's default (10 s, then SIGKILL) cut that
    # short. Matches terminationGracePeriodSeconds in k8s/worker.yaml.
    stop_grace_period: 40s
    environment:
      NODE_ENV: development
      REDIS_HOST: redis
      REDIS_PORT: 6379
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: distributed_engine
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      LOG_LEVEL: info
      # Traces: empty sends none. With the tracing profile, set it to
      # http://otel-collector:4318 (see docs/diagrams/05-tracing.md).
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      # Hosts the `http` task type may call (comma-separated). Empty disables it.
      HTTP_TASK_ALLOWED_HOSTS: ${HTTP_TASK_ALLOWED_HOSTS:-}
      # Of those, the ones that may resolve to a private address (internal services).
      HTTP_TASK_PRIVATE_HOSTS: ${HTTP_TASK_PRIVATE_HOSTS:-}
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: engine-web
    ports:
      - "3001:3001"
    environment:
      ENGINE_API_URL: http://api:3000
      OPERATOR_API_KEY: ${OPERATOR_API_KEY:?Set OPERATOR_API_KEY in .env - see .env.example}
      DASHBOARD_USER: ${DASHBOARD_USER:?Set DASHBOARD_USER in .env - see .env.example}
      DASHBOARD_PASSWORD: ${DASHBOARD_PASSWORD:?Set DASHBOARD_PASSWORD in .env - see .env.example}
    depends_on:
      api:
        condition: service_healthy

  # --- Tracing infrastructure (profile: tracing) ---

  jaeger:
    image: jaegertracing/jaeger:2.1.0
    container_name: engine-jaeger
    profiles:
      - tracing
      - observability
    ports:
      - "16686:16686" # Jaeger UI
    environment:
      COLLECTOR_OTLP_ENABLED: "true"

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.102.0
    container_name: engine-otel-collector
    profiles:
      - tracing
      - observability
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
    volumes:
      - ./otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml
    depends_on:
      - jaeger

  # --- Metrics (profile: metrics) ---

  prometheus:
    image: prom/prometheus:v3.1.0
    container_name: engine-prometheus
    profiles:
      - metrics
      - observability
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    # The API's /metrics/prometheus needs the operator key; it reaches
    # Prometheus as a file, never in the config.
    secrets:
      - operator_api_key
    depends_on:
      api:
        condition: service_healthy

  # --- Logging infrastructure (profile: logging) ---

  loki:
    image: grafana/loki:3.1.0
    container_name: engine-loki
    profiles:
      - logging
      - observability
    ports:
      - "3100:3100"
    volumes:
      - ./loki-config.yaml:/etc/loki/local-config.yaml
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --output-document=- http://localhost:3100/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  alloy:
    image: grafana/alloy:v1.2.1
    container_name: engine-alloy
    profiles:
      - logging
      - observability
    volumes:
      - ./alloy-config.alloy:/etc/alloy/config.alloy
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: run /etc/alloy/config.alloy
    depends_on:
      loki:
        condition: service_healthy

  grafana:
    image: grafana/grafana:11.1.0
    container_name: engine-grafana
    profiles:
      - logging
      - metrics
      - observability
    ports:
      # 3001 is the engine dashboard (web).
      - "3002:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      - grafana_data:/var/lib/grafana
    depends_on:
      # Only with the logging profile; with `metrics` alone Grafana shows
      # Prometheus and the Loki datasource is simply unreachable.
      loki:
        condition: service_healthy
        required: false

secrets:
  operator_api_key:
    environment: OPERATOR_API_KEY

volumes:
  redis_data:
  postgres_data:
  loki_data:
  grafana_data:

networks:
  default:
    name: engine-network
