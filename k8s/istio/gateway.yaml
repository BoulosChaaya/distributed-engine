apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: engine-gateway
  namespace: distributed-engine
spec:
  gatewayClassName: istio
  listeners:
  - name: http
    port: 80
    protocol: HTTP
    allowedRoutes:
      namespaces:
        from: Same
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: api-route
  namespace: distributed-engine
spec:
  parentRefs:
  - name: engine-gateway
  rules:
  - backendRefs:
    - name: api
      # Service port, not container port: the api Service maps 80 -> 3000.
      port: 80
