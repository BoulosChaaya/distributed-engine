apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: authz-api
  namespace: distributed-engine
spec:
  selector:
    matchLabels:
      app: api
  action: ALLOW
  rules:
  - from:
    - source:
        principals:
        - "cluster.local/ns/distributed-engine/sa/engine-gateway-istio"
        # The dashboard calls the API server-side with the operator key.
        - "cluster.local/ns/distributed-engine/sa/web-sa"
    to:
    - operation:
        ports: ["3000"]
