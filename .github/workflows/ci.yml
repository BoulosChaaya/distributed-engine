name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Read-only by default; only the publish job may write packages.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-test:
    name: build-and-test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # 22 is the oldest supported (package.json engines); 24 is what the images run next.
        node: [22, 24]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: distributed_engine_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      # pnpm comes from package.json "packageManager", so local and CI use the same version.
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      # Type-aware: needs the build above for @repo/shared's declarations.
      - name: Lint
        if: matrix.node == 22
        run: pnpm run lint
      - name: PostgreSQL connection budget fits at full scale
        run: node scripts/check-db-connection-budget.mjs

      - name: Configure Redis authentication
        run: docker exec ${{ job.services.redis.id }} redis-cli CONFIG SET requirepass testpassword123

      - name: Test
        run: pnpm test
        env:
          TEST_POSTGRES_URL: postgresql://postgres:postgres@localhost:5432/distributed_engine_test
          TEST_REDIS_HOST: localhost
          TEST_REDIS_PORT: 6379
          REDIS_PASSWORD: testpassword123

      - name: Build Docker images
        if: matrix.node == 22
        run: |
          docker build -f Dockerfile.api -t distributed-engine-api:ci .
          docker build -f Dockerfile.worker -t distributed-engine-worker:ci .
          docker build -f Dockerfile.web -t distributed-engine-web:ci .

      - name: Smoke production entrypoints
        if: matrix.node == 22
        run: bash scripts/smoke-production-images.sh
        env:
          REDIS_PASSWORD: testpassword123

  publish-images:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Image names must be lowercase; the repository owner (BoulosChaaya) is not. Using it as-is
      # made every push to main fail at "docker build -t", so no image was ever published.
      - name: Image names
        id: names
        run: |
          owner="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          echo "api=ghcr.io/${owner}/distributed-engine-api:${{ github.sha }}" >> "$GITHUB_OUTPUT"
          echo "worker=ghcr.io/${owner}/distributed-engine-worker:${{ github.sha }}" >> "$GITHUB_OUTPUT"
          echo "web=ghcr.io/${owner}/distributed-engine-web:${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        run: echo '${{ secrets.GITHUB_TOKEN }}' | docker login ghcr.io -u '${{ github.actor }}' --password-stdin

      - name: Build and push
        run: |
          docker build -f Dockerfile.api -t '${{ steps.names.outputs.api }}' .
          docker build -f Dockerfile.worker -t '${{ steps.names.outputs.worker }}' .
          docker build -f Dockerfile.web -t '${{ steps.names.outputs.web }}' .
          docker push '${{ steps.names.outputs.api }}'
          docker push '${{ steps.names.outputs.worker }}'
          docker push '${{ steps.names.outputs.web }}'

      - name: Image digests
        run: |
          echo "API:    $(docker inspect --format='{{index .RepoDigests 0}}' '${{ steps.names.outputs.api }}')"
          echo "Worker: $(docker inspect --format='{{index .RepoDigests 0}}' '${{ steps.names.outputs.worker }}')"
          echo "Web:    $(docker inspect --format='{{index .RepoDigests 0}}' '${{ steps.names.outputs.web }}')"
