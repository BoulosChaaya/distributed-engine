name: Full stack

# Proves the system as deployed, not just as unit-tested:
#   compose-chaos: the whole docker compose stack under a killed worker and
#                  a flushed Redis.
#   compose-metrics: Prometheus scraping the API and every worker, including
#                  while Redis is down.
#   kind-istio:    the real k8s manifests on Kubernetes with Istio ambient,
#                  including mTLS identity, AuthorizationPolicy deny paths and
#                  a task driven through the Gateway.
#   demo:          scripts/demo.sh, the guided tour, run unattended.
#   run-locally:   docs/RUN-LOCALLY.md followed top to bottom, as a person
#                  would on a laptop.
# The load and endurance test is its own workflow (load.yml).
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: full-stack-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  compose-chaos:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Chaos test (SIGKILL a worker, FLUSHALL Redis, require every task to complete)
        run: |
          set -o pipefail
          bash scripts/chaos-compose.sh 2>&1 | tee "$RUNNER_TEMP/chaos.log"
      - name: Publish result as annotations
        if: always()
        run: bash scripts/ci-annotate-log.sh "$RUNNER_TEMP/chaos.log" compose-chaos 40

  compose-metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Prometheus scrapes API and workers; Redis loss shows as a gap, not zeros
        run: |
          set -o pipefail
          bash scripts/metrics-compose.sh 2>&1 | tee "$RUNNER_TEMP/metrics.log"
      - name: Publish result as annotations
        if: always()
        run: bash scripts/ci-annotate-log.sh "$RUNNER_TEMP/metrics.log" compose-metrics 40

  # docs/RUN-LOCALLY.md is run top to bottom, as a person would follow it.
  run-locally:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Follow docs/RUN-LOCALLY.md
        run: |
          set -o pipefail
          bash scripts/check-run-locally.sh 2>&1 | tee "$RUNNER_TEMP/run-locally.log"
      - name: Publish result as annotations
        if: always()
        run: bash scripts/ci-annotate-log.sh "$RUNNER_TEMP/run-locally.log" run-locally 400

  kind-istio:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build images
        run: |
          docker build -f Dockerfile.api -t distributed-engine-api:ci .
          docker build -f Dockerfile.worker -t distributed-engine-worker:ci .
          docker build -f Dockerfile.web -t distributed-engine-web:ci .
      - name: Deploy to kind with Istio ambient and verify
        run: |
          set -o pipefail
          bash scripts/k8s-kind-e2e.sh 2>&1 | tee "$RUNNER_TEMP/kind.log"
      - name: Publish result as annotations
        if: always()
        run: bash scripts/ci-annotate-log.sh "$RUNNER_TEMP/kind.log" kind-istio 120

  # The demo script is documentation people will run; keep it working.
  demo:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run the guided demo unattended
        run: |
          set -o pipefail
          bash scripts/demo.sh --no-pause 2>&1 | tee "$RUNNER_TEMP/demo.log"
      - name: Publish result as annotations
        if: always()
        run: bash scripts/ci-annotate-log.sh "$RUNNER_TEMP/demo.log" demo 45
      - name: Tear down
        if: always()
        run: docker compose down -v
